name: Deployment

on:
  push:
    tags: "v*"

jobs:
  release:
    name: Build and create release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      contents: write
      actions: write
      deployments: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node.js
        uses: actions/setup-node@v4

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Bump manifest version
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Push manifest change
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: fxmanifest.lua
          push: true
          author_name: Manifest Bumper
          message: 'chore: bump manifest version to ${{ github.ref_name }}'

      - name: Update tag ref
        uses: EndBug/latest-tag@v1.6.3
        with:
          ref: ${{ github.ref_name }}

      - name: Bundle built files
        run: |
          mkdir -p ./temp/fmsdk
          cp ./{README.md,LICENSE,fxmanifest.lua,config.schema.json,config.json} ./temp/fmsdk
          cp -r ./dist ./temp/fmsdk/dist
          cd ./temp && zip -r ../fmsdk.zip ./fmsdk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Fivemanage SDK | ${{ github.ref_name }}
          prerelease: false
          files: fmsdk.zip

        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
